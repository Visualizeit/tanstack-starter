allowBuilds:
    esbuild: false
    lmdb: false
    msgpackr-extract: false

catalog:
    oxfmt: 0.73.0
    oxlint: 1.88.0
    vite: npm:@voidzero-dev/vite-plus-core@1.1.0
    vite-plus: 1.1.0
    vitest: 5.0.4

minimumReleaseAge: 0

overrides:
    oxfmt: 'catalog:'
    oxlint: 'catalog:'
    vite@*: 'catalog:'
    vitest@*: 'catalog:'

peerDependencyRules:
    allowAny:
        - vite
    allowedVersions:
        vite: '*'
